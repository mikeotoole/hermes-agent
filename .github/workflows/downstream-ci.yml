name: Downstream CI

on:
  pull_request:
    branches: ["downstream/main"]
  push:
    branches: ["downstream/main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downstream-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python suite ${{ matrix.slice }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.12"
      - name: Install locked development environment
        run: |
          python -m pip install uv==0.11.2
          uv sync --extra dev --frozen
      - name: Run canonical Python suite
        run: scripts/run_tests.sh --slice "${{ matrix.slice }}/4" -j 4

  node:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
